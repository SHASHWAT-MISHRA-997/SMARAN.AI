# SMARAN.AI - Windows NVIDIA GPU single-container deployment
name: smaran-ai
services:
  app:
    image: shashwatmishra062/smaran-ai:app-v1.0.0
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smaran-ai
    ports:
      - 3003:3003
    environment:
      JWT_SECRET: gmr-robotics-local-security-secret-key-98765
      ACTIVE_MODEL: Qwen/Qwen3-4B-AWQ
      INFERENCE_ENGINE: vllm
      MAX_MODEL_LEN: 2048
      VLLM_URL: http://127.0.0.1:8000/v1
      DATA_DIR: /app/data
      HF_HOME: /root/.cache/huggingface
      VLLM_GPU_MEMORY_UTILIZATION: 0.75
    volumes:
      - smaran_models:/root/.cache/huggingface
      - smaran_data:/app/data
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  smaran_models:
    external: true
    name: smaran-ai_smaran_models
  smaran_data:
    external: true
    name: smaran-ai_smaran_data
