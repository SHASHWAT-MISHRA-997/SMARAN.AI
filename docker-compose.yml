name: smaran-ai

# Portable CPU-first deployment. No host CPU/GPU/RAM values are hardcoded.
# For real host telemetry and automatic Docker installation, use the platform
# installer documented in README.md; a container cannot read every host metric
# without an explicit host-side bridge.
services:
  host-telemetry:
    image: ${SMARAN_IMAGE:-shashwatmishra062/smaran-ai:2.8.5}
    container_name: smaran-host-telemetry
    restart: unless-stopped
    entrypoint: ["python", "/opt/smaran/host_telemetry_bridge.py", "--output", "/app/data/host_stats.json"]
    volumes:
      - smaran_data:/app/data
    networks:
      - smaran_local
    # Run with host PID/IPC to access host hardware metrics (Linux only)
    # On Windows/Mac, this service will run but may not detect all hardware
    pid: "host"
    ipc: "host"
    privileged: true
    environment:
      DATA_DIR: /app/data
    healthcheck:
      test: ["CMD", "sh", "-c", "test -f /app/data/host_stats.json && cat /app/data/host_stats.json | python -c \"import sys,json,time; d=json.load(sys.stdin); raise SystemExit(0 if time.time()-float(d.get('timestamp',0)) < 15 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  ollama:
    image: ollama/ollama:latest
    container_name: smaran-ollama
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - smaran_local
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  starter-model:
    image: ollama/ollama:latest
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "qwen2.5:1.5b"]
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - smaran_local
    depends_on:
      ollama:
        condition: service_healthy

  app:
    build: .
    image: ${SMARAN_IMAGE:-shashwatmishra062/smaran-ai:2.8.5}
    container_name: smaran-ai
    restart: unless-stopped
    ports:
      - "3003:3003"
    environment:
      DATA_DIR: /app/data
      HF_HOME: /app/data/models
      HUGGINGFACE_HUB_CACHE: /app/data/models/hub
      INFERENCE_ENGINE: ollama
      OLLAMA_URL: http://ollama:11434
      ACTIVE_MODEL: qwen2.5:1.5b
      MAX_MODEL_LEN: "4096"
      SMARAN_AUTO_PULL_MODEL: "0"
      SMARAN_IMAGE: ${SMARAN_IMAGE:-shashwatmishra062/smaran-ai:2.8.5}
    volumes:
      - smaran_data:/app/data
    networks:
      - smaran_local
    depends_on:
      starter-model:
        condition: service_completed_successfully
      host-telemetry:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3003/api/test/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  smaran_data:
    name: smaran_data
  ollama_models:
    name: smaran-ai-ollama-models

networks:
  smaran_local:
    name: smaran-ai-local
    driver: bridge
