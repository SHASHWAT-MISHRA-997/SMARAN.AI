name: smaran-ai

services:
  # vLLM OpenAI-Compatible Inference Server (Qwen 3 VL 4B Vision Model)
  inference-server:
    image: vllm/vllm-openai:v0.8.5.post1
    container_name: smaran-inference
    ports:
      - "8001:8000"
    volumes:
      - smaran_models:/root/.cache/huggingface
    environment:
      - VLLM_USE_V1=0
    command: --model Qwen/Qwen3-4B-AWQ --port 8000 --host 0.0.0.0 --max-model-len 8192 --gpu-memory-utilization 0.90 --trust-remote-code --dtype=half --quantization awq
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Monolithic App Container (FastAPI Backend + Vite Frontend)
  app:
    build: .
    image: shashwatmishra062/smaran-ai:latest
    container_name: smaran-app
    ports:
      - "3003:3003"
    environment:
      - JWT_SECRET=gmr-robotics-local-security-secret-key-98765
      - ACTIVE_MODEL=Qwen/Qwen3-4B-AWQ
      - INFERENCE_ENGINE=vllm
      - VLLM_URL=http://smaran-inference:8000/v1
      - DATA_DIR=/app/data
    volumes:
      - ./backend/app:/app/app
      - ./backend/frontend_dist:/app/frontend_dist
      - smaran_data:/app/data
      - smaran_models:/root/.cache/huggingface
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  smaran_data:
  smaran_models:
