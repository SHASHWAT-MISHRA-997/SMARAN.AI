[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smaran-cli"
dynamic = ["version"]
description = "Command line for SMARAN.AI, the local-first AI assistant"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Shashwat Mishra" }]
keywords = ["ai", "assistant", "cli", "local", "smaran"]

# No dependencies on purpose. This talks to a local HTTP server over the
# standard library, so installing it cannot break an environment and needs
# nothing compiled.
dependencies = []

[project.urls]
Homepage = "https://smaran-ai.netlify.app"
Source = "https://github.com/SHASHWAT-MISHRA-997/SMARAN.AI"

[project.scripts]
smaran = "smaran_cli.main:main"

[tool.setuptools.packages.find]
include = ["smaran_cli*"]
# The wheel is tagged py3-none-any and the project claims >=3.9, but builds
# were picking up __pycache__ from the source tree and shipping six
# cpython-314 .pyc files inside it - version-specific bytecode in a wheel
# advertised as working on any Python. Excluded here so a stale working tree
# cannot put it back.
exclude = ["*__pycache__*"]

[tool.setuptools.dynamic]
version = { attr = "smaran_cli.__version__" }
