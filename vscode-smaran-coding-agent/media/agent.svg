<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#7000FF" />
      <stop offset="100%" stop-color="#FF007A" />
    </linearGradient>
    <linearGradient id="codeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF66" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Cyber Hexagon Shield -->
  <polygon points="32,4 58,18 58,46 32,60 6,46 6,18" fill="#0D0E15" stroke="url(#cyberGrad)" stroke-width="2.5" filter="url(#neonGlow)" />

  <!-- Code Brackets <> and AI Matrix Core -->
  <path d="M22,24 L14,32 L22,40" stroke="url(#codeGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M42,24 L50,32 L42,40" stroke="url(#codeGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="35" y1="22" x2="29" y2="42" stroke="#FF007A" stroke-width="2.5" stroke-linecap="round" />

  <!-- Orbiting Neural Pulses -->
  <circle cx="32" cy="14" r="2.5" fill="#00FF66" />
  <circle cx="48" cy="42" r="2" fill="#00F0FF" />
  <circle cx="16" cy="42" r="2" fill="#FF007A" />
</svg>
