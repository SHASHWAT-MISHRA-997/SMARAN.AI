<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="140" height="140">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141724" />
      <stop offset="100%" stop-color="#080a10" />
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#71717a" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="goldBrain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect x="20" y="20" width="360" height="360" rx="80" fill="url(#bgGrad)" stroke="url(#goldBorder)" stroke-width="8" />
  
  <!-- Neural Brain Network -->
  <g filter="url(#goldGlow)" stroke="url(#goldBrain)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Brain Outer Lobes -->
    <path d="M 200,80 C 130,80 100,120 100,180 C 100,240 140,270 170,280 C 180,260 190,240 200,240 C 210,240 220,260 230,280 C 260,270 300,240 300,180 C 300,120 270,80 200,80 Z" stroke-width="6" opacity="0.8" />
    
    <!-- Left Hemisphere Convolutions -->
    <path d="M 140,110 Q 180,120 170,160 Q 130,170 140,210 Q 170,230 190,210" stroke-width="4" />
    <path d="M 120,150 Q 160,170 150,210 Q 180,220 180,240" stroke-width="4" />
    <path d="M 160,130 Q 190,160 190,190" stroke-width="3" />
    <path d="M 110,180 Q 140,190 150,240" stroke-width="3.5" />
    <path d="M 180,95 Q 160,140 195,160" stroke-width="3" />

    <!-- Right Hemisphere Convolutions -->
    <path d="M 260,110 Q 220,120 230,160 Q 270,170 260,210 Q 230,230 210,210" stroke-width="4" />
    <path d="M 280,150 Q 240,170 250,210 Q 220,220 220,240" stroke-width="4" />
    <path d="M 240,130 Q 210,160 210,190" stroke-width="3" />
    <path d="M 290,180 Q 260,190 250,240" stroke-width="3.5" />
    <path d="M 220,95 Q 240,140 205,160" stroke-width="3" />
    
    <!-- Central Fissure -->
    <line x1="200" y1="85" x2="200" y2="235" stroke-width="5" stroke-dasharray="4,6" />
    
    <!-- Glowing Synapse Nodes -->
    <circle cx="140" cy="110" r="6" fill="#FDE68A" />
    <circle cx="260" cy="110" r="6" fill="#FDE68A" />
    <circle cx="170" cy="160" r="5.5" fill="#F59E0B" />
    <circle cx="230" cy="160" r="5.5" fill="#F59E0B" />
    <circle cx="120" cy="150" r="5" fill="#FDE68A" />
    <circle cx="280" cy="150" r="5" fill="#FDE68A" />
    <circle cx="150" cy="210" r="6" fill="#F59E0B" />
    <circle cx="250" cy="210" r="6" fill="#F59E0B" />
    <circle cx="180" cy="240" r="5.5" fill="#FDE68A" />
    <circle cx="220" cy="240" r="5.5" fill="#FDE68A" />
    <circle cx="200" cy="120" r="7" fill="#FFF" />
    <circle cx="200" cy="180" r="7" fill="#FFF" />
    <circle cx="110" cy="180" r="4.5" fill="#F59E0B" />
    <circle cx="290" cy="180" r="4.5" fill="#F59E0B" />
    <circle cx="160" cy="130" r="4.5" fill="#FDE68A" />
    <circle cx="240" cy="130" r="4.5" fill="#FDE68A" />
  </g>

  <!-- Typography: SMARAN.AI -->
  <text x="200" y="338" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" letter-spacing="4" fill="#FDE68A" text-anchor="middle" filter="url(#goldGlow)">SMARAN.AI</text>
</svg>
