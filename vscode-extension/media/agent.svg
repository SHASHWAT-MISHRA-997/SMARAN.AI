<!--
  The activity bar icon.

  A hexagon with code brackets stood here, which was not the SMARAN.AI mark at
  all. This is the mark reduced to its silhouette: the rounded square, and the
  brain inside it.

  Monochrome on purpose, and it has to be. VS Code paints activity bar icons
  as a single-colour mask - it takes the shape and throws the colours away, so
  the glowing orange brain cannot appear here however it is drawn. The full
  logo is in the panel's own header, where colour survives.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"
     fill="none" stroke="currentColor" stroke-width="1.4"
     stroke-linecap="round" stroke-linejoin="round">

  <!-- The rounded square the mark sits in. -->
  <rect x="2" y="2" width="20" height="20" rx="5.5" />

  <!-- The brain: two lobes over a stem, the shape at the centre of the logo. -->
  <path d="M12 7.4v8.4" />
  <path d="M12 8.1c-.5-1-1.5-1.5-2.5-1.2-1.1.3-1.6 1.3-1.4 2.2-.9.3-1.4 1.2-1.2 2.1.2.9 1 1.4 1.8 1.4-.3.9.1 1.9 1 2.3.9.4 1.9.1 2.3-.7" />
  <path d="M12 8.1c.5-1 1.5-1.5 2.5-1.2 1.1.3 1.6 1.3 1.4 2.2.9.3 1.4 1.2 1.2 2.1-.2.9-1 1.4-1.8 1.4.3.9-.1 1.9-1 2.3-.9.4-1.9.1-2.3-.7" />

  <!-- The base line the wordmark sits on. -->
  <path d="M8.5 18h7" />
</svg>
