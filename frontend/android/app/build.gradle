apply plugin: 'com.android.application'

android {
    namespace = "ai.smaran.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "ai.smaran.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 21071
        versionName "1.0.11"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // Vosk (the offline "Hey SMARAN" listener) is the only native code in
        // the app, and every phone sold in years is arm64 or armv7. x86_64 (Intel
        // Chromebooks, emulators) cost another 10 MB for almost nobody.
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Native libraries compressed in the APK. Stored uncompressed they were
    // 17 MB of the download for a one-time saving at install.
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
    // Self-signed release key. Android requires every APK to be signed;
    // this identifies the build as coming from the same source each time,
    // so updates install over the previous one.
    //
    // The credentials live in keystore.properties, which is git-ignored.
    // They used to be written here in plain text, which meant publishing
    // the repository would hand anyone the ability to sign an APK that
    // Android treats as an update to this app.
    //
    // Copy keystore.properties.example to keystore.properties and fill it
    // in to build a signed release. Without it, only debug builds work.
    signingConfigs {
        release {
            def props = new Properties()
            def propsFile = rootProject.file('keystore.properties')
            if (!project.hasProperty('smaranUnsigned') && propsFile.exists()) {
                propsFile.withInputStream { props.load(it) }
                // Resolved from the android/ root, not the app module:
                // bare file() here would look inside app/ and miss it.
                storeFile rootProject.file(props['storeFile'])
                storePassword props['storePassword']
                keyAlias props['keyAlias']
                keyPassword props['keyPassword']

                /* Both schemes, not just v2.
                 *
                 * Gradle turns v1 off by default once minSdk is 24, and for
                 * Android itself that is correct - 7.0 and newer verify v2.
                 * But a file downloaded from a browser is often opened through
                 * a file manager or a third-party installer, and several of
                 * those still look for the v1 JAR signature and refuse an APK
                 * that has none. It costs a few kilobytes and removes a whole
                 * class of "it will not install".
                 */
                enableV1Signing true
                enableV2Signing true
            }
        }
    }
    buildTypes {
        release {
            if (!project.hasProperty('smaranUnsigned')) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation "androidx.credentials:credentials:1.5.0"
    implementation "androidx.credentials:credentials-play-services-auth:1.5.0"
    implementation "com.google.android.libraries.identity.googleid:googleid:1.1.1"
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    // Offline speech recognition for the wake word. It reads the microphone
    // directly and never takes audio focus, so music keeps playing while it
    // listens - Android's own recogniser pauses it every time.
    implementation 'com.alphacephei:vosk-android:0.3.47@aar'
    implementation 'net.java.dev.jna:jna:5.13.0@aar'
    // openWakeWord's models run on ONNX Runtime: a detector built for "Hey
    // ...", where Vosk is a transcriber doing its best with names it has no
    // words for.
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.22.0'
}

/* The wake-word model, packaged into the APK.

   Not committed: 57 MB of binaries has no business in git history. Fetched
   once per machine into .vosk-cache (git-ignored), refused unless its SHA-256
   matches the file that was tested, and unpacked into generated assets that
   Vosk's StorageService copies to storage on first run. The `uuid` file is
   how StorageService tells a new model from the one already unpacked. */
def voskModel = [
    name  : 'vosk-model-small-en-in-0.4',
    url   : 'https://alphacephei.com/vosk/models/vosk-model-small-en-in-0.4.zip',
    sha256: '20663dcac4d5cb783a579c54d98339344a688e4ec6e1b4a4b059fd1235454cc7',
]
def voskAssets = layout.buildDirectory.dir('generated/vosk-assets')

tasks.register('prepareWakeWordModel') {
    def zip = rootProject.file(".vosk-cache/${voskModel.name}.zip")
    def outDir = voskAssets.get().dir('vosk-en-in').asFile
    inputs.property('sha256', voskModel.sha256)
    outputs.dir(outDir)
    doLast {
        def sha = { File f ->
            def digest = java.security.MessageDigest.getInstance('SHA-256')
            f.withInputStream { stream ->
                byte[] buffer = new byte[1 << 16]
                int n
                while ((n = stream.read(buffer)) > 0) digest.update(buffer, 0, n)
            }
            digest.digest().encodeHex().toString()
        }
        if (!zip.exists() || sha(zip) != voskModel.sha256) {
            zip.parentFile.mkdirs()
            logger.lifecycle("Downloading ${voskModel.url}")
            def part = new File(zip.path + '.part')
            new URL(voskModel.url).withInputStream { input -> part.withOutputStream { it << input } }
            def got = sha(part)
            if (got != voskModel.sha256) {
                part.delete()
                throw new GradleException("Wake-word model checksum mismatch: ${got}")
            }
            if (zip.exists()) zip.delete()
            part.renameTo(zip)
        }
        project.delete(outDir)
        project.copy {
            from(project.zipTree(zip)) {
                include "${voskModel.name}/**"
                eachFile { details ->
                    details.path = details.path.substring(voskModel.name.length() + 1)
                }
                includeEmptyDirs = false
            }
            into outDir
        }
        new File(outDir, 'uuid').text = voskModel.sha256.substring(0, 16)
    }
}

android.sourceSets.main.assets.srcDir(voskAssets)
tasks.named('preBuild').configure { dependsOn 'prepareWakeWordModel' }

/* openWakeWord (github.com/dscripka/openWakeWord, v0.5.1): the audio features
   and the "hey jarvis" detector. Code Apache-2.0; the pretrained wake model is
   CC BY-NC-SA 4.0 - free for SMARAN as a non-commercial app, and to be replaced
   by a model trained in-house if it is ever sold. See assets/oww/NOTICE. */
def owwModels = [
    'melspectrogram.onnx' : 'ba2b0e0f8b7b875369a2c89cb13360ff53bac436f2895cced9f479fa65eb176f',
    'embedding_model.onnx': '70d164290c1d095d1d4ee149bc5e00543250a7316b59f31d056cff7bd3075c1f',
    'hey_jarvis_v0.1.onnx': '94a13cfe60075b132f6a472e7e462e8123ee70861bc3fb58434a73712ee0d2cb',
]
def owwAssets = layout.buildDirectory.dir('generated/oww-assets')

tasks.register('prepareOpenWakeWord') {
    def outDir = owwAssets.get().dir('oww').asFile
    inputs.property('models', owwModels.toString())
    outputs.dir(outDir)
    doLast {
        def sha = { File f ->
            def digest = java.security.MessageDigest.getInstance('SHA-256')
            f.withInputStream { stream ->
                byte[] buffer = new byte[1 << 16]
                int n
                while ((n = stream.read(buffer)) > 0) digest.update(buffer, 0, n)
            }
            digest.digest().encodeHex().toString()
        }
        outDir.mkdirs()
        owwModels.each { name, expected ->
            def cached = rootProject.file(".vosk-cache/oww/${name}")
            if (!cached.exists() || sha(cached) != expected) {
                cached.parentFile.mkdirs()
                def url = "https://github.com/dscripka/openWakeWord/releases/download/v0.5.1/${name}"
                logger.lifecycle("Downloading ${url}")
                def part = new File(cached.path + '.part')
                new URL(url).withInputStream { input -> part.withOutputStream { it << input } }
                def got = sha(part)
                if (got != expected) {
                    part.delete()
                    throw new GradleException("openWakeWord ${name} checksum mismatch: ${got}")
                }
                if (cached.exists()) cached.delete()
                part.renameTo(cached)
            }
            project.copy { from cached; into outDir }
        }
        new File(outDir, 'NOTICE').text = """openWakeWord models, from https://github.com/dscripka/openWakeWord (v0.5.1).
melspectrogram.onnx and embedding_model.onnx: Apache License 2.0.
hey_jarvis_v0.1.onnx: Creative Commons Attribution-NonCommercial-ShareAlike 4.0 (CC BY-NC-SA 4.0),
by David Scripka. Used unmodified in a free, non-commercial app.
"""
    }
}

android.sourceSets.main.assets.srcDir(owwAssets)
tasks.named('preBuild').configure { dependsOn 'prepareOpenWakeWord' }

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
