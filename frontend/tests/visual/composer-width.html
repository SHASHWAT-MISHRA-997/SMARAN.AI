<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="/assets/index-v2.10.39-BQqn01v6.css">
<style>body{margin:0}#wrap{border:1px solid #444}</style></head>
<body>
<!-- The workspace is the container the composer measures itself against.
     The viewport stays wide on purpose: that is the case that broke. -->
<div id="wrap"><div class="chat-workspace"><form class="composer-shell">
  <div class="composer-input">
    <button id="more" class="composer-compact-more sm:hidden">+</button>
    <textarea></textarea>
  </div>
  <div id="left" class="composer-desktop-left hidden sm:flex"><button>Attach</button></div>
  <div id="right" class="composer-desktop-right hidden sm:flex"><button>Speak</button></div>
</form></div></div>
<script>
window.probe = function (px) {
  var w = document.getElementById('wrap');
  w.style.width = px + 'px';
  void w.offsetWidth;
  var g = function (id) { return getComputedStyle(document.getElementById(id)).display; };
  return { container: px, viewport: window.innerWidth,
           more: g('more'), left: g('left'), right: g('right') };
};
</script></body></html>
